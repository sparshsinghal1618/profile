<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPARSH.S — Offline</title>
  <style>
    :root {
      --bg: #fff0df;
      --ink: #38223e;
      --lime: #f04c78;
    }
    html, body { margin: 0; padding: 0; font-family: "Space Grotesk", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 1.5rem; }
    .logo { font-weight: 800; font-size: 1.6rem; letter-spacing: 0.18em; margin-bottom: 0.8rem; }
    .logo span { color: var(--lime); }
    h1 { margin: 0; font-size: 2.2rem; line-height: 1.05; }
    p { margin: 1rem 0 1.6rem; opacity: 0.7; }
    a.button { text-decoration: none; padding: 0.9rem 1.6rem; border-radius: 999px; background: var(--lime); color: var(--bg); font-weight: 600; letter-spacing: 0.16em; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <div class="logo">SPARSH<span>.S</span></div>
    <h1>You're offline</h1>
    <p>There's no internet connection right now. We'll try again when you're back online.</p>
    <a class="button" href="./">RELOAD</a>
  </main>
</body>
</html>
